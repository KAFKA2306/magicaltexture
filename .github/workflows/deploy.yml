name: CI & Deploy to HuggingFace Spaces

on:
  push:
    branches: [ "main" ]
    paths:
      - "app.py"
      - "src/**"
      - "requirements.txt"
      - "README.md"
      - ".github/workflows/**"
      - "assets/**"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Smoke Test
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check --select E,F --line-length 120 app.py src/

      - name: Smoke test (import app)
        run: |
          python - << 'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("app", "app.py")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          print("App import OK")
          PY

      - name: Verify creator-ready batch ZIP
        run: |
          python - << 'PY'
          import hashlib
          import json
          import os
          import zipfile

          from PIL import Image

          from src.generators import generate_batch

          eye = Image.new("RGBA", (8, 8), (100, 80, 60, 255))
          mask = Image.new("L", (8, 8), 255)
          gallery, zip_path = generate_batch(
              eye,
              mask,
              ["pastel_pink"],
              ["Basic"],
              "ci_eye",
              0.7,
              1.0,
              0.4,
              0.3,
              True,
              0.07,
              0.14,
              0.06,
          )
          assert len(gallery) == 1
          with zipfile.ZipFile(zip_path) as zf:
              names = set(zf.namelist())
              assert {"preset_manifest.json", "README.txt", "emission_mask.png"} <= names
              manifest = json.loads(zf.read("preset_manifest.json"))
              assert manifest["generator"]["revision"] == os.environ["GITHUB_SHA"]
              assert manifest["selection"]["palettes"] == ["pastel_pink"]
              assert manifest["selection"]["modes"] == ["Basic"]
              assert manifest["package"]["guide"] == "README.txt"
              assert manifest["package"]["primary_preview"] in names
              assert manifest["package"]["runtime_validation"] == "not_performed"
              guide = zf.read("README.txt").decode("utf-8")
              assert "Unity / lilToonでの確認" in guide
              assert "元素材の規約" in guide
              outputs = manifest["outputs"]
              assert {item["kind"] for item in outputs} == {
                  "main_texture",
                  "emission_mask",
                  "package_guide",
              }
              for item in outputs:
                  payload = zf.read(item["path"])
                  assert hashlib.sha256(payload).hexdigest() == item["sha256"]
                  assert len(payload) == item["size_bytes"]
          print("Creator-ready batch ZIP OK")
          PY

      - name: Package artifact
        if: always()
        run: |
          mkdir -p dist
          zip -r dist/magicaltexture-${{ github.sha }}.zip app.py src/ requirements.txt README.md || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/*.zip

  deploy:
    name: Deploy to HuggingFace Spaces
    needs: test
    if: success() && (github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: |
          python -m pip install -U huggingface_hub

      - name: Check secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          test -n "$HF_TOKEN" || (echo "HF_TOKEN not set" && exit 1)
          test -n "$HF_SPACE_ID" || (echo "HF_SPACE_ID not set" && exit 1)

      - name: Stamp deployed revision
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: printf '%s\n' "$GITHUB_SHA" > .magicaltexture-revision

      - name: Upload to Space via HfApi
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - << 'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          repo_id = os.environ["HF_SPACE_ID"]
          msg = f"CI deploy: {os.environ.get('GITHUB_SHA','')}"

          api = HfApi(token=token)
          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path=".",
              path_in_repo=".",
              allow_patterns=[
                  "app.py",
                  "src/**",
                  "requirements.txt",
                  "README.md",
                  "assets/**",
                  ".magicaltexture-revision",
              ],
              ignore_patterns=[
                  ".git/**",
                  ".github/**",
                  "dist/**",
                  "**/__pycache__/**",
              ],
              commit_message=msg,
          )
          print(f"Uploaded to Space: {repo_id}")
          PY

      - name: Restart Space (trigger build)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          python - << 'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.restart_space(repo_id=os.environ["HF_SPACE_ID"])
          print("Space restart triggered")
          PY
