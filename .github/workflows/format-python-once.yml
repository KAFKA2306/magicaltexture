name: Format Python sources once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-python-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Format canonical Python sources
        run: |
          python -m pip install black==26.5.1
          black app.py src/
      - name: Verify flake8 contract
        run: |
          python -m pip install flake8==7.3.0
          flake8 --max-line-length 120 app.py
          flake8 --max-line-length 120 src/*.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py src/
          git commit -m 'style: normalize Python formatting'
          git push
